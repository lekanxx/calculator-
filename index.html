<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
</head>

<body>

    <div class="calculator">

        <!-- Menu icon -->
        <div class="menu">
            <span></span>
            <span></span>
            <span></span>
        </div>


        <!-- Display -->
        <div class="display">

            <div id="expressionDisplay"></div>

            <div id="resultDisplay">0</div>

        </div>


        <!-- Buttons -->
        <div class="buttons">

            <button class="function" id="clear">AC</button>

            <button class="function" id="sign">+/-</button>

            <button class="function" id="percentage">%</button>

            <button class="operator" data-value="/">
                ÷
            </button>


            <button data-value="7">7</button>

            <button data-value="8">8</button>

            <button data-value="9">9</button>

            <button class="operator" data-value="*">
                ×
            </button>


            <button data-value="4">4</button>

            <button data-value="5">5</button>

            <button data-value="6">6</button>

            <button class="operator" data-value="-">
                -
            </button>


            <button data-value="1">1</button>

            <button data-value="2">2</button>

            <button data-value="3">3</button>

            <button class="operator" data-value="+">
                +
            </button>


            <button class="calculator-icon">
                <i class="fa-solid fa-calculator"></i>
            </button>

            <button data-value="0">0</button>

            <button data-value=".">.</button>

            <button class="operator" id="equals">
                =
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
